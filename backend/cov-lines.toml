# Config alternativa: cobertura por LINHAS apenas (sem branch).
# Uso: COVERAGE_RCFILE=cov-lines.toml .venv/bin/python -m pytest
[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"
