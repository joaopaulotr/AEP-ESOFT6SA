name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Testes unitários com cobertura (mínimo 70%)
        env:
          OPENAI_API_KEY: test-key
        run: pytest --cov-fail-under=70 --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Cobertura do backend"
              echo
              echo '```'
              coverage report
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publica a cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: |
            backend/htmlcov
            backend/coverage.xml
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-latest
    services:
      # MongoDB real para os testes de integração (-m mongo): índices, $lookup e agregações.
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Testes de integração com MongoDB real
        env:
          OPENAI_API_KEY: test-key
          MONGO_TEST_URI: mongodb://localhost:27017/ci
        run: pytest -m mongo --no-cov
